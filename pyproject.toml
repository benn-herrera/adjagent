[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adjagent"
dynamic = ["version"]
description = "Adjagent renders agent, command and skill definitions to order, for any supported harness and model family, from one source in which text definitions share is written once"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
adjagent = "adjagent.cli:main"

[project.urls]
Repository = "https://github.com/benn-herrera/adjagent"

[tool.setuptools.packages.find]
include = ["adjagent", "adjagent.*"]

[tool.setuptools.package-data]
adjagent = ["kb-tools/**/*", "harnesses/resources/**/*", "docdicer-tools/**/*", "docdicer-tools/**/.*", "development-tools/**/*"]

[tool.setuptools.dynamic]
version = { attr = "adjagent.__version__" }
