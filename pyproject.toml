[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "devpro"
dynamic = ["version"]
description = "Devpro renders agent, command and skill definitions to order, for any supported harness and model family, from one source in which text definitions share is written once"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
devpro = "devpro.cli:main"

[project.urls]
Repository = "https://github.com/benn-herrera/devpro"

[tool.setuptools.packages.find]
include = ["devpro", "devpro.*"]

[tool.setuptools.package-data]
devpro = ["kb-tools/**/*", "harnesses/resources/**/*", "docdicer-tools/**/*", "docdicer-tools/**/.*", "development-tools/**/*"]

[tool.setuptools.dynamic]
version = { attr = "devpro.__version__" }
