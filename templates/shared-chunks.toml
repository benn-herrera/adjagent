[chunks.mad-design-multipath-convergence]
text = '''- **(b) Multi-path convergence**: participants reach the same @!arg.result!@ via demonstrably independent @!arg.paths!@. Both paths are preserved in the deliverable as mutually reinforcing confirmations of the same @!arg.result!@. This is a strong-positive outcome.'''

[chunks.mad-design-unresolved-divergence]
defaults.record = ""
text = '''- **(@!arg.letter!@) Unresolved divergence**: participants remain at @!arg.divergence!@ after the round cap. All candidates are documented@!arg.record!@ and preserved for human arbitration.'''

# Heading-less on purpose: each consumer writes its own section heading, because
# what the value is called differs and the rule does not.
[chunks.mad-design-reference-value]
text = '''Where the problem has a known reference value (e.g., @!arg.examples!@), participants may compute their @!arg.construction!@'s prediction and compare. A @!arg.construction!@ that disagrees with the reference is not automatically wrong — @!arg.caveat!@ — but the disagreement must be acknowledged and explained.

A reference value MUST NOT be load-bearing in the @!arg.construction!@ itself. It may be used at the end for validation, and its role must be stated explicitly.'''


# ─── ML technique work ───────────────────────────────────────────────────────

# No heading here: each consumer expands this inside a section of its own. The
# lead sentences name the artifact and the bullets deliberately do not — a
# bullet that named it would need unit= too.
[chunks.ml-technique-deliverable]
text = '''**Each @!arg.unit!@ must produce three indivisible elements: a *mechanism* (how the technique works), a *justification* (why it should work, grounded in model or system behavior), and a *measurement* (how we will know whether it does).**

The @!arg.unit!@ must include, at minimum:

- **Mechanism** — the specific technique or modification, described precisely enough to implement: what computation changes, where in the pipeline it sits, what new state or weights it introduces, what it replaces
- **Justification** — why this mechanism should produce the desired behavior. Ground in known model dynamics (residual stream behavior, attention patterns, gradient flow, distribution shift, etc.), prior empirical results from analogous regimes, or first-principles reasoning. If the justification is "it worked in paper X," explain why the conditions of paper X transfer to the current problem
- **Predicted observable behavior** — what should be measurable if the mechanism is working as hypothesized. Concrete predictions ("logprob agreement within 0.01 on held-out prompts," "attention entropy drops by ≥30% in layers > N," "perplexity matches baseline within 5%") are stronger than vague ones ("output quality should improve")
- **Measurement plan** — how the predicted behavior will be tested. Identify the dataset/prompt set, the metric, the baseline to compare against, and the threshold that would falsify the hypothesis. If the measurement requires infrastructure that does not yet exist, name it
- **Failure modes** — what specifically would go wrong if the mechanism is incorrect, and whether each failure mode would be silent (model produces wrong-but-plausible output) or loud (NaN, exception, obvious garbage). Identify every silent failure mode explicitly — these are the highest-cost category to debug
- **Cost accounting** — compute (FLOPs, wall time), memory (VRAM, RAM, persistent storage), and complexity (lines changed, new abstractions introduced, ongoing maintenance burden). Compare to the cheapest baseline that achieves a comparable result and explain why the additional cost is justified'''

# A bare noun-phrase list, so lead= supplies the verb and each consumer keeps
# its own moment. Keep that value quote-free — a marker argument value cannot
# carry a double quote (ARG, gen-defs.py).
[chunks.ml-technique-attacks]
text = '''@!arg.lead!@ mechanism descriptions that are too vague to implement, justifications that smuggle the conclusion as a premise, predictions that cannot be measured or that would be true regardless of whether the mechanism worked, baselines that are not actually comparable, missing failure-mode analysis (especially silent ones), cost accounting that ignores ongoing maintenance or omits a cheaper alternative, hidden assumptions about model size / architecture / regime that the problem does not specify, and citations to prior work whose conditions do not transfer to the current problem.'''
