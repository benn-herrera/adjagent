@!pe-declare-bullet!@
@!pe-stop-bullet!@
@!pe-shared-infra-bullet!@
@!pe-global-state-bullet!@
@!pe-scoped-gate-bullet!@
@!pe-expansion-bullet!@
@!pe-scope-creep-bullet!@
'''
variants.platform = '''
