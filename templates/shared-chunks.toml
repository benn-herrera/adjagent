text = '''**Logging**: use `os.Logger` (OSLog) for structured logging — not print() or NSLog(). Log levels are runtime-configurable via Console.app. @!logging-backend-seam backend="OSLog"!@ This @!logging-abstraction-note!@'''

# ─── Parallel execution ──────────────────────────────────────────────────────

[chunks.pe-preamble]
text = '''You may be dispatched as one of several agents working on the same codebase simultaneously.'''

[chunks.pe-read-bullet]
text = '''- **Read before touching**: read every file you will edit before making any changes.'''

[chunks.pe-declare-bullet]
defaults.act = '''modify'''
text = '''- **Declare scope**: state which files you will @!arg.act!@ before starting. Do not touch files outside this set without explicit instruction.'''

[chunks.pe-stop-bullet]
text = '''- **Stop on conflict**: if mid-task you discover you need to modify a file another agent may be editing, stop and report rather than proceeding.'''

[chunks.pe-expansion-bullet]
text = '''- **Scope expansion**: if you discover the task is significantly larger than described — requires touching additional systems, reveals a fundamental design gap, or would affect other agents' work — stop immediately and report to the coordinator. Do not make unilateral expansion decisions.'''

[chunks.pe-scope-creep-bullet]
defaults.examples = '''improve adjacent code, add comments to unchanged files'''
text = '''- **No scope creep**: complete the assigned task and stop. Don't @!arg.examples!@, or expand the task boundary.'''

[chunks.pe-shared-infra-bullet]
text = '''- **Additive over invasive in shared infrastructure**: build files, shared configs, shared types and interfaces are read by work in flight you cannot see. Where the task can be done by adding alongside rather than restructuring, add — restructuring one of these is its own assignment, never a step inside another.'''

[chunks.pe-global-state-bullet]
text = '''- **No global-state commands**: package installs, dependency upgrades, config changes and migrations land outside your declared files and reach every agent in the tree. Run none of them unless your instructions say to.'''

[chunks.pe-scoped-gate-bullet]
text = '''- **Read a gate against your own scope**: run the narrowest runner target that covers your files. Where only a whole-tree gate exists, a failure it reports outside your declared scope is someone else's work in flight — report it and leave it. Never fix it, and never read it as evidence that your own change must grow.'''

