  sed '1,/^---$/d' <topic-file> > @!arg.dir!@/topic.md
  ```

  Every topic path you hand out — to a local seat, to the liaison, to AA — is `@!arg.dir!@/topic.md`, and never the invocation's own topic path. It is a permanent audit artifact like the rest of the run directory: what the seats read is what the run recorded.
