# mad-aa-misclassification's second paragraph, gate-failure-is-informative
# against mad-gate-closing-rules' `What the gate is not` plus mad-gate-fails,
# parallel dispatch against mad-parallel-dispatch, design's multi-path bullet
# against its own Multi-path convergence paragraph. The two that carried
