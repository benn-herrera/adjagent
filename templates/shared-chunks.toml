@!pe-read-bullet!@
@!pe-declare-bullet!@ Platform-required adjacent files (@!arg.adjacent!@) directly necessitated by the change are in scope without pre-declaration.
@!pe-stop-bullet!@
@!pe-shared-infra-bullet!@
