**Partial concessions**: when some seats concede while others' positions are unchanged, each conceding seat must still provide a plain-language explanation (per the @!arg.seat!@ contract). The consistency check and implication test in Steps @!arg.steps!@ above apply only once every active seat has recorded `agree` simultaneously.
'''

[chunks.mad-round-aa-update]
text = '''
**Step 3 — Update AA**

Dispatch AA with every active seat's round response and the list of retired points. AA returns the updated alignment map; write it verbatim to `aa-round-[N]-map.md`.

Write `round-[N].md` (see Document Format).
'''

# Opens each referee's gate section. Design carried this sentence and review
# did not: review restated its own three gate checks there instead, four
# paragraphs after Phase 3 Step 2 ran them. THE RULING, 2026-09: the
# restatement is gone and both sections open on this pointer, so a section
# headed for the gate but holding only meta-rules does not read as the gate's
# definition — which is the reading that invites a referee to reconstruct one.
# Design's trailing `do not restate the gate checks here` did not survive the
# move: it directs whoever edits the template, and nothing the referee does
# can violate it. It is this comment now.
[chunks.mad-gate-meta-lead]
text = '''
The gate logic itself lives in Phase 3 Step 2 above. The rules below govern *how* you apply it.
'''

# The gate sections' shared tail. The `Your role` paragraph above it is left
# inline: design tests structural equivalence between constructions and review
# tests comprehension of a resolution, and the two say different things about
# what the referee is deciding.
[chunks.mad-gate-closing-rules]
text = '''
**What the gate is not**: it is not a quality assessment. A gate failure is a useful finding — it tells the human arbitration reviewer that the models could not ground their @!arg.agreement!@ in a form that survives outside scrutiny.

**Exhaustion is not @!arg.converge!@**: if the active seats stop arguing without a gate-passing @!arg.outcome!@, the point is contested. Record "no gate-passing @!arg.outcome!@ reached" in the arbitration queue. Do not retire on mutual silence.

**Authoritative record**: `@!arg.state!@` is the authoritative record for retirement status. When it disagrees with AA's running alignment history, the session state governs.
'''

# The Output Paths table itself stays inline: four of its seven rows differ in
# both the document column and the filename, and parameterizing it would cost
# eight arguments to share three rows of table data. The note below it is the
# rule the table serves, and is shared.
# The closing `per Round isolation they are never handed to a seat` is gone,
# 2026-09: the two aggregate rows of the table immediately above it already
# read `human — never a seat`, and mad-round-isolation states the prohibition
# in full. A table whose Audience column stops saying that is the one edit
# that would need this clause back.
[chunks.mad-output-paths-note]
text = '''
`<seat>` is the seat's roster name (`fable`, `opus`, `sonnet`, `haiku`, `guest`), lowercase, verbatim. The per-seat and map files are the dispatch inputs; the aggregates exist so a human can read the whole debate in one place.
'''

[chunks.mad-initial-aggregate-format]
text = '''
### `@!arg.aggregate!@`

One section per active seat, in roster order, then the map:

```
# @!arg.title!@

## Seat `<seat>` — Conclusions
[that seat's Conclusions section verbatim]

  ... repeat for every active seat on the roster ...

## Initial Alignment Map
[AA's alignment map verbatim, as written to aa-initial-map.md]
```

Seats that failed to return get a section too, reading `*(no response — see session state)*`. Silence must be visible.
'''

[chunks.mad-round-document-format]
text = '''
### `round-[N].md`

```
# Debate Round [N] — [@!arg.name!@]

## Points of Contention This Round
[List from alignment map]

## Seat `<seat>` — Response
[that seat's round response verbatim]

  ... repeat for every active seat on the roster ...

## Stance Record
[One row per contention point: each active seat's recorded stance — agree / contest / abstain (reason). This table is what the @!arg.gate!@ gate read; a blank cell means the seat recorded no stance, which blocked retirement.]

## Points Retired This Round
[For each: which gate checks passed, plain-language @!arg.resolution!@, retirement tag]

## AA Correction Log *(if any)*
[For each correction: finding ID, error corrected, reason, triggered by seat challenge or referee verification]

## Updated Alignment Map
[AA's updated alignment map verbatim]
```
'''

[chunks.mad-roster-record-line]
text = '''
Open `@!arg.final!@` with a one-line roster record — which seats ran, and which (if any) failed mid-run. A reader judging the weight of @!arg.weight!@ needs to know how many independent models produced it.
'''

# Only the lead. The session-state body below it is each mode's own schema —
# design records an outcome field and a problem statement, review neither — and
# a shared skeleton there would be a form with a hole at every line.
[chunks.mad-session-state-lead]
text = '''
## Session State

Write to `@!arg.state!@` at every phase transition. Each write replaces the file with the complete current-state snapshot. The file always reflects the current state, not a history — the round documents provide the audit trail.
'''

