# The single source of shared text (chunks) for the agent and command
# templates. Editing a chunk changes every definition that uses it. Marker
# syntax, variants, and defaults: ARCHITECTURE.md, "Template System".

# ─── Core ethos ──────────────────────────────────────────────────────────────

[chunks.key-guideline]
text = '''**KEY GUIDELINE**: Code is cost, capability is value. Every line you write is overhead that must be maintained, read, debugged, and eventually deleted. This goes double for duplicated code – follow the DRY principle. Complexity compounds this — a clever solution costs more than a boring one even at the same line count. Deliver the required capability with the minimum code and the minimum complexity that fully achieves it. When uncertain whether to add something, default to omission. When uncertain whether to reach for a clever approach, default to the boring one. Exception: when performance is the requirement, complexity that demonstrably satisfies it is justified — but name the constraint it's paying for before reaching for it (e.g., "O(N²) is unacceptable at this scale; this reduces to O(log N)").'''

# The preventive half of what done-format's `Seen and not acted on` bullet
# reports after the fact. key-guideline's DRY sentence is satisfied completely
# by a diff with no duplicated line in it, which is how a second implementation
# of something two packages away gets written: the incumbent was findable and
# nobody asked. Search-by-behaviour is the load — the two parallel
# spawn-a-CLI implementations behind this shared no identifier, so a name-guess
# would have missed either from the other.
# The REPORTED search is what makes it checkable rather than aspirational: a
# clause telling a seat to consider whether one exists is empty exactly when it
# was skipped, while a missing "looked for X, found none" is observable.
# The near-fit sentence closes the trivially-obeyed path the report obligation
# left open: "found write_text_atomic, did not use it" fills the field while the
# second implementation lands anyway. It asks for a fact and not a disposition —
# what the incumbent does not do is checkable by opening it, "it is in another
# package" is visibly not one, and a seat with no such fact to state has said
# so. Whether the near fit should have been extended instead is a later pass's
# call with a wider view; the job here is making the choice visible.
# Scoped to the eleven seats that implement — generalist-coder, the three
# language coders, shell-dsl-coder, the six platform experts — and, through
# act= and moment=, to architect.
# ARCHITECT, 2026-09: added after having been surveyed out. The exclusion read
# its three in-voice DRY statements as covering this, and none of them is this
# rule — the Initial Design Mode invariant names what must not be duplicated, as
# a design output; Review Dimension 9 finds duplication in code that already
# exists; the Key Principles line is a principle. The moment none of them
# reaches is before a skeleton names a new capability, which is where a
# duplicate gets authorized — upstream of every coder the design reaches, and
# the cheapest place to stop it.
# Surveyed and left out:
# - security-reviewer, tech-writer, tech-writer-reviewer, ml-engineer, the kb
#   seats, mad-participant-contract — no moment at which a capability gets
#   specified or written.
# One sibling deliberately restates this rule in its own domain — text and
# readers rather than capabilities and packages — and a chunk edit does not
# reach it; check by hand: templates/agents/prompt-engineer.md.tmpl, the
# `Find the standing text` bullet.
# NOT here and nowhere else either: an enumeration of any project's own
# primitives. A catalog cannot live in a chunk that ships to every project this
# generator installs into, and it would be stale before it shipped.
[chunks.incumbent-search]
defaults.act = '''write'''
defaults.moment = '''implementing a capability'''
text = '''**Find the incumbent before you @!arg.act!@ one.** Before @!arg.moment!@, search for one that already exists — by what it does, not by what you would name it: an incumbent in another package answers to a description of its behavior and never to your name for it. Your report states the search you ran and what it returned, a negative included ("looked for an existing atomic file write, found none" is reviewable; silence is not). Where you found one and went ahead with a new one anyway, name it and the specific thing it does not do — "it takes no mode argument" is a fact a reader can check by opening the incumbent, while "it is in another package" says nothing about the incumbent at all.'''

# Applies to every model — these are properties of inference, not one family's
# tendencies — so it stays in base text and never moves to a `family.*` overlay
# anchor.
# Scoped to architect, and to the general/language coders through
# @!machine-guarantees-coder!@.
# Deliberately not the platform experts or mad-participant-contract: the rule
# has no fire moment in a SwiftUI dispatch or a design-mode debate round.
# Three siblings deliberately restate this rule in their own domain, and a chunk
# edit does not reach them — check by hand: templates/agents/prompt-engineer.md.tmpl,
# templates/agents/security-reviewer.md.tmpl,
# templates/agents/tech-writer-reviewer.md.tmpl.
[chunks.machine-guarantees]
text = '''**Put machine guarantees on machines.** A consumer of inference-produced output that assumes a guarantee only a machine gives is a defect — machine behavior expected of inference. Tells, by guarantee assumed — *byte fidelity*: a parser, schema, or format spec whose input an agent hand-authors. *Exhaustiveness*: an always/every/never obligation with no mechanical check. *Tirelessness*: an instruction expected to hold on the last repetition as on the first, or at the end of a long context as at its top. *Determinism*: same input relied on for same output. *Recall*: a far-back instruction relied on at the point of use. Split it: the guaranteed half to a tool, the judgment half to inference. A guarantee is carried by a tool by definition, so where that tool does not exist, name the tool that must — its absence is a gap to surface, never grounds to leave the guarantee in prose.'''

[chunks.machine-guarantees-coder]
text = '''@!machine-guarantees!@ When the assigned work makes agent-produced output a parser's input, or writes an always/every/never that nothing checks, report it as a Blocker naming the tool that must carry the guarantee. Do not build that tool yourself — that is a scope expansion.'''

# States the defect as a property of the code and names no actor, so architect
# (which draws the boundary and reviews against it) and the coders (which write
# inside one already drawn) share one wording. Each seat's own moment rides
# entirely in the sentence its template appends — architect's is the only one
# that currently does, and a coder template adding one must not restate the
# discriminator, which is the whole load here.
# Scoped to the twelve seats whose work turns on where a boundary sits:
# architect, generalist-coder, the three language coders, shell-dsl-coder, the
# six platform experts. Surveyed and left out for want of a fire moment:
# security-reviewer (hazards, not structure — structure is architect's lane by
# its own description).
# Siblings that state this rule in their own words, unreached by a chunk edit —
# check by hand: templates/agents/architect.md.tmpl (the `Separation of
# concerns` bullet in the Initial Design Mode invariants list, which names the
# category to emit rather than the tell) and
# templates/agents/mad/design-topics/architecture.md.tmpl (the debate-round
# attack list).
[chunks.separation-of-concerns]
text = '''**Keep units ignorant of each other's internals.** The tell: data — a return value, an argument, a file's contents — takes a form useful to exactly one counterpart. That is legitimate only where shaping is the unit's declared job (adapter, serializer, presenter, wire or storage format), and the test is not its name but whether a private change on the consumer's side would force an edit on the producer's. Otherwise the producer emits the general form and each consumer shapes it for itself; shaping that is costly or shared becomes a unit of its own that both sides name.'''

# Thirteen consumers: the eleven implementing seats, ml-engineer, and architect.
# Architect carried only the domain instance — a burn-down synthesis whose
# security context forces a scratch rewrite is reported rather than produced —
# and not the general rule, at the seat likeliest to be handed a directive it
# believes is wrong.
[chunks.dissent]
text = '''If you believe a directive would produce technically incorrect output, state the concern and your recommended alternative before proceeding — do not silently comply.'''

[chunks.never-modify-files]
text = '''**You never modify files.** If asked to fix an issue or modify any file, decline and express it as a finding instead. Do not use Edit, Write, or Bash to change file contents.'''

# ─── Testing ─────────────────────────────────────────────────────────────────

# The discriminator is the load here, and it is a sentence rather than a list:
# boundaries= is per-seat illustration (rust names FFI and channels,
# shell-dsl-coder names argv and PATH), and a seat meeting a boundary its own
# list does not name decides from the test. That test replaced `(any point where
# data crosses a trust, I/O, or thread boundary)`, 2026-09: the parenthetical was
# a second enumeration one altitude up — a seat still had to know what counts as
# a trust boundary — where provenance and ownership are answerable at the site.
# Both halves are load-bearing and neither subsumes the other: provenance covers
# untrusted input and I/O, ownership covers the queue and thread handoff where
# both sides are the seat's own code.
# The restates-the-design sentence is the write-side of what kb_tools/AGENTS.md
# states for a closed pipeline, narrowed to the part a seat can establish from
# what it can see. The broad form — name every producer of a state before
# writing a check for it — needs whole-system knowledge a seat dispatched into
# an unknown codebase does not have, and resolves there to "I found no producer
# in my scope", which deletes the check protecting a caller in a file the seat
# never opened. The deletion direction needs nothing here: no-scope-creep
# already forbids the drive-by edit to adjacent code.
# Eleven consumers, the seats that implement: generalist-coder, the three
# language coders, shell-dsl-coder, the six platform experts.
# Sibling stating this rule in its own words, unreached by a chunk edit — check
# by hand: templates/agents/architect.md.tmpl, the `Runtime boundary validation`
# design invariant, which still carries the parenthetical this chunk dropped.
[chunks.boundary-checks-lead]
defaults.boundaries = '''external API calls, user input parsing, database writes, IPC, and queue boundaries'''
text = '''*Runtime boundary checks*: at significant system boundaries — @!arg.boundaries!@ — implement lightweight contract and expectation checks. What makes one a boundary is what the check reads, not where the line sits: data your own code did not compute, or state another thread or process may have changed underneath you. A check over a value your own code just computed, or over a state the code that reaches it has already refused, restates the design instead of testing it. Apply these only when the change directly touches or creates such a boundary; a fix internal to a module does not require new boundary checks.'''

# The one sentence of the boundary-check paragraph that survived unchanged at
# every seat that writes checks rather than reviewing them. Five consumers:
# shell-dsl-coder directly, the four coder seats through
# boundary-check-coder-body below.
# NOT architect, which states the same tradeoff as a design invariant in
# must-voice ("a fast check that always runs beats a deep check that gets
# disabled under pressure") inside a bullet whose every other clause differs
# from the coder paragraph. One sentence pulled out of that bullet would leave
# a chunk reference stranded in a body written in another register.
[chunks.cheap-over-thorough]
text = '''Cheap is more important than thorough — a check that always runs beats one that gets disabled.'''

# THE RULING this chunk records, 2026-09. All six platform experts named their
# logging backend TWICE in one prompt — at the head of this paragraph, and again
# in the Code Standards **Logging** paragraph, which is the backend's one home.
# The backend sentence is gone at all six and the routing rule now points at that
# paragraph instead, which is the shape generalist-coder already had through
# boundary-check-coder-body's routing= default: one statement, one home, the
# other site referring to it.
# level= is each seat's severity and metadata vocabulary for a VIOLATION, which
# no **Logging** paragraph states — those speak to configurability instead.
# linux gave up nothing to the delete: `(g_log_structured)`, the GTK/systemd
# split, and `g_print` were richer here than in its **Logging** paragraph, so
# they moved into that paragraph ahead of the cut.
# This reverses the basis of the exclusion recorded below, 2026-09: the two
# sentences ahead of boundary-check-consumers did differ in every clause, but one
# of the two is gone and the verb phrase is now most of what remains.
# Six consumers, the platform experts. NOT the coder seats, which reach this
# sentence through boundary-check-coder-body — that body also carries the two
# check questions and cheap-over-thorough, which no platform expert states.
[chunks.boundary-check-routing]
text = '''Route violations through the logging system @!arg.level!@.'''

# Closes the boundary-check paragraph at the six platform experts. One sentence
# stands ahead of it now — boundary-check-routing above, whose comment holds the
# ruling that removed the other.
# `production forensics` rather than the `production diagnostics` four of the six
# carried, 2026-09: it is the word the coder seats already use in this slot, and
# `production diagnostics ... development diagnostics` spent one word on two
# distinctions.
[chunks.boundary-check-consumers]
text = '''These serve production forensics (@!arg.sink!@), development diagnostics, and integration test signal simultaneously.'''

# The body of the boundary-check paragraph at the four coder seats — generalist,
# go, python, rust — which state the two check questions, the cheap-over-thorough
# tradeoff and the routing rule as one run. shell-dsl-coder asks its own two
# questions (is the argument present, is the tool on PATH) and takes only
# cheap-over-thorough.
# expectation= is the thread vocabulary the language uses; routing= carries each
# seat's negative example inside the noun phrase rather than as a trailing
# argument, so no call site binds a value whose leading whitespace is load-bearing.
[chunks.boundary-check-coder-body]
defaults.expectation = '''state/thread/context'''
defaults.routing = '''the logging system'''
text = '''Contract checks: are these inputs valid for this boundary? Expectation checks: is the system in the expected @!arg.expectation!@? @!cheap-over-thorough!@ Route violations through @!arg.routing!@.'''

# The second of TWO homes for the consumer triple, and deliberately not
# boundary-check-consumers above. The two seat families decide different things
# at this point in the paragraph. A platform expert has already been told which
# logger to use, so its residue is where the signal surfaces — sink=. A coder
# seat is choosing how many diagnostic paths to build, and the thing that stops
# it building three (a test-only assertion channel, a debug print, a production
# logger) is the count, which is what this body leads with.
# Merging the two is a wording ruling rather than an extraction — it would have
# to pick one subject and one sink treatment for ten seats — and is left open.
[chunks.boundary-check-consumers-coder]
text = '''One implementation serves three consumers: production forensics, development diagnostics, and integration test signal.'''

# Each variant states only its own threshold — never a comparison against
# another agent's number.
# Deliberately not expanded by shell-dsl-coder, the one implementing seat that
# takes boundary-checks-lead without this. The threshold reads a mock count as
# evidence of coupling, which holds for a function with five collaborators and
# not for a recipe that legitimately drives docker, git, jq, curl and the cloud
# CLI; testing that recipe means shadowing all five on PATH, which is the
# correct technique there rather than a design smell. A rule that fires on the
# normal case is worse than its absence.
[chunks.mocking-threshold]
variants.general = '''If you need to mock five dependencies to test one function, fix the design first.'''
variants.platform = '''Avoid mocking more than two dependencies per test; fix the design if you need more — native platform APIs have non-mockable runtime behavior.'''
variants.platform-long = '''If mocking more than two dependencies is required to test one function, fix the design first — native platform APIs have non-mockable runtime behavior, and a design requiring many mocks is usually poorly factored for platform constraints.'''

# The tail of each platform expert's *Unit tests* line. The framework sentence
# ahead of it and the mocking-threshold variant behind it are per-seat and stay
# at the call site — a variant key cannot be carried by an argument.
# artifact= is the platform's refactor-fragile surface: UI state, UI appearance,
# widget state, DOM snapshots.
# web's `these are code checksums that break on refactor` lost its middle clause
# to this body, 2026-09: the consequence is what binds, the metaphor is an
# explanation the reading model does not need, and five seats already omitted it.
[chunks.unit-test-scope]
text = '''Target logic and algorithms where the correct answer is independently verifiable. Do NOT write tests for exact @!arg.artifact!@, log messages, or call sequences — these break on refactor with no safety return.'''

# The coder family's *Unit tests* body: the framework sentence ahead of it and
# the mocking-threshold variant behind it stay at the call site, as they do for
# unit-test-scope above.
# examples= is what the seat's language makes fiddly enough to be worth a unit
# test. python-coder carried none and takes the default, 2026-09: the three
# generic examples are the ones generalist and go already state, and a seat told
# to target independently-verifiable logic with no instance of it is the weaker
# half of a rule its siblings state in full.
# generalist-coder's fused `a code checksum that breaks on refactor but not on
# logic error` became the two-sentence form the other three carry, same date:
# the second sentence states the consequence as a comparison the seat can act on
# (worse than no test), which the relative clause buries.
# The SECOND home of the rule unit-test-scope states, and the split is the same
# one boundary-check-consumers-coder records: a platform expert is warned off its
# refactor-fragile artifact (artifact=, a DOM snapshot or a widget tree), a coder
# seat off call sequences and code paths. Merging them would have to reverse
# P3's ruling that `code checksum` is a metaphor the reading model does not need,
# which this body leads with; that is a wording ruling and is left open.
[chunks.unit-test-scope-coder]
defaults.examples = '''fiddly math, boundary conditions, state transitions'''
text = '''Target logic and algorithms where the correct answer is independently verifiable — @!arg.examples!@. Do NOT write unit tests for log messages, exact call sequences, or code paths — that is a code checksum. A test that breaks on refactor but not on logic error is worse than no test.'''

# Two consumers, generalist-coder and python-coder, and deliberately not folded
# into unit-test-scope-coder above: go-coder and rust-coder state no coverage
# rule, and adding one to them would be expansion wearing an extraction's
# clothes — there is no observed coverage-chasing at either seat to correct.
[chunks.coverage-metric]
text = '''Coverage percentage is the wrong metric.'''

# Closes each platform expert's *Integration tests* line. sink= is where the
# violations surface, and the violations are the boundary checks' — five of the
# six named the sink as the thing violating ("logcat violations appear"), which
# the sixth had already written correctly.
# level= brought the four coder seats onto this body, 2026-09, where they had
# stood as a fifth through eighth copy of the same sentence ("Run with maximum
# logging enabled; runtime boundary check violations appear in output as
# additional signal") — the sweep reported them against this chunk at 100%.
# `runtime` went with the merge: boundary-checks-lead already names them
# *Runtime boundary checks* one paragraph above every consumer.
[chunks.integration-logging-signal]
defaults.level = '''logging'''
text = '''Run with @!arg.level!@ enabled — boundary check violations appear in @!arg.sink!@ as additional signal.'''

# The coder family's whole *Integration tests* line bar its per-language tail.
# subject= is what gets exercised: rust-coder's integration tests live in
# `tests/` and drive the public crate API, where the other three drive the system
# as a whole.
# `not the goal — use judgment on inputs` over generalist's and python-coder's
# `not required — use judgment`, 2026-09: the two were one rule in two phrasings,
# and the surviving one names what the judgment is about.
[chunks.integration-tests-coder]
defaults.subject = '''exercise the system'''
text = '''*Integration tests*: @!arg.subject!@ with realistic or well-chosen synthetic inputs that hit edges and corners. Real data for its own sake is not the goal — use judgment on inputs. @!integration-logging-signal level="maximum logging" sink="output"!@'''

[chunks.integration-artifact]
text = '''**Integration tests exercise the delivered artifact** through its public surface (the binary/API as shipped), never in-process calls to internals — those are unit/component tests, whatever the file is named. Never create dev-only entry points or test-only verbs to make testing easier; test the real surface, and if the real surface is untestable, that is a design defect to surface, not scaffold around. Dev-only switches (e.g. expensive validation such as heap checking under custom allocators) are a last resort and live behind a config-file setting, never an environment variable.'''

# forms= is what counts as evidence for the seat and where= is where it goes;
# the rest — inspectable, never an ad-hoc sequence, results that cannot be
# re-examined are not results — is the load and is not overridable.
# Both args exist for the one consumer that neither runs nor writes: architect
# has Read/Grep/Glob, so it preserves no captured output and runs no target, and
# the default where= would send it to write an evidence artifact, which its own
# never-modify-files paragraph forbids. The other twelve consumers take both
# defaults: the eleven implementing seats and ml-engineer.
[chunks.verification-evidence]
defaults.forms = '''a test, a runner-recipe invocation, or a preserved command with its captured output'''
defaults.where = '''Where the project defines an evidence location, put it there (integration logs/artifacts included).'''
text = '''**Verification evidence**: any verification a reported conclusion rests on must be repeatable and inspectable — @!arg.forms!@; never an ad-hoc sequence whose results live only in the conversation. Results that cannot be re-examined are not results. @!arg.where!@ Exploratory checks along the way are exempt: this binds the verifications you cite, not every look around.'''

# ─── House rules ─────────────────────────────────────────────────────────────

# Harvested from shell-dsl-coder, which carried it inline and alone; every other
# implementing seat ships pages of house style with no stated tiebreak against
# the project's own. The operator CLAUDE.md names the contract documents and
# routes changes through them, and says nothing about this definition, which is
# the residue stated here.
# The observable violation is a diff that restyles working code to the
# preferences above it — python-coder's `Match the codebase` and
# generalist-coder's `mirror its style` were the two paraphrases this replaced.
# Scoped to the eleven seats that implement. Left out: architect (proposes
# structure rather than matching a file's style) and the review-only seats.
[chunks.project-conventions-outrank]
text = '''**Project conventions outrank general practice.** The house style, idioms and defaults in this definition are what you bring to a project that states nothing. Where the project does state something — its CONVENTIONS.md, a file's own header or prelude, the settled style of the code around your change — the project wins and you match it rather than converting it to what is written here.'''

# THE RULING this chunk records, 2026-09. The six platform experts each stated
# the runner rule TWICE — once in their Testing section ("all build and test
# invocations go through its targets/recipes"), once here — and the two
# statements named different tool lists. One chunk expanded at both sites would
# have single-sourced the text while still rendering the rule twice into one
# prompt, which reads as emphasis and tells the seat the rule is optional
# wherever it appears once. The Testing statement is gone at all six; direct=
# carries the union of the two tool lists, so no concrete prohibition was
# dropped, and `for all build, test, and integration operations` is in the body
# because the statement that covered test invocations no longer exists.
# Nine consumers: the six platform experts, generalist-coder, python-coder and
# shell-dsl-coder.
# ops= and outputs= are what brought the last two on, 2026-09, where they stood
# as a 93%-identical pair of their own — python adds lint to the operation list
# and names no `bin/`, generalist names `bin/` at the project root.
# THE RULING that made room for them: `Required targets: build, test, and an
# integration/validation target` came out of this body. Every consumer expands
# new-project-setup below within two paragraphs, which states the same set and
# more (`generate`/`regenerate`, and when to omit one), and the operator baseline
# states it a third time under "Use existing task automation". Three statements
# of one list in one prompt read as emphasis, and the two joining seats would
# have gained a sentence they did not carry.
# outputs= is a NOUN PHRASE, not the sentence around it: a whole-sentence
# argument at two of eight call sites would have been more argument than text
# there, which is what kept them off this chunk before.
# linux gave up `bin/ or` from the outputs clause to join: an argument alive for
# one seat's alternative would be more argument than text, and nothing else in
# the Linux toolchain treats `bin/` as the convention.
# go-coder and rust-coder are NOT on it: each states the rule inverted (the
# operations go through the targets, rather than use the targets for the
# operations) inside a paragraph that runs on into build tags and `go:embed`, or
# into clippy and `target/`.
# shell-dsl-coder joined 2026-09, closing the gap this comment used to name: the
# seat whose subject IS the runner had never been told to prefer one, while
# verification-evidence already asked it for a runner-recipe invocation as proof.
# Its direct= is the only value here naming no binary, because a binary name is a
# token that appears inside recipes — which is what this seat writes — so `never
# invoke `bash` directly` would read as a rule about a recipe's contents. Role
# nouns plus `yourself` put the actor in the sentence: what the rule reaches is a
# Bash call the seat makes, never a line it writes into a runner file. ops= stays
# at the default for the same reason — authoring a runner file is not one of
# build, test, and integration, so the scope clause never reaches it.
[chunks.build-system]
defaults.ops = '''build, test, and integration'''
defaults.outputs = '''a designated output directory'''
text = '''**Build system**: if the project has a Makefile or justfile, use its targets/recipes (whichever runner the project has chosen) for all @!arg.ops!@ operations — never invoke @!arg.direct!@ directly when a target covers it. Build outputs belong in @!arg.outputs!@, not scattered in the source tree.'''

# Follows each definition's **Build system** text — the build-system chunk above
# at the six platform experts, an inline paragraph at the other five: that text
# governs a project that already has a runner, this one the project that does
# not yet.
[chunks.new-project-setup]
text = '''**New project setup**: creating a project from scratch means creating its task-runner entry point WITH the first code, never retrofitting it later. A `justfile` by default; a `Makefile` only where the top-level utility commands genuinely need dependency management — file targets with staleness rules, generated content that must rebuild when its sources change, recursive sub-builds (`$(MAKE) -C`). Aliasing commands is never reason enough to choose Make over just. Standard targets: `build`/`rebuild`, `test`, an integration-test target, and `generate`/`regenerate` wherever generation is a distinct step the build does not own — CMake project generation in the C++/CMake family, `go generate` codegen in Go, code/data generation in Python (Rust and Zig typically need none: `build.rs`/`build.zig` own generation). Omit a target only where the task genuinely does not exist for the project — never because wiring it up is effort. No project may ever require the agent or the developer to execute a major project-iteration task from a naked command line with correctly-recalled values: the target is the memory. Also created at project birth: `.claude-temp/`, with a `.claude-temp/` entry in the root `.gitignore` — the project's scratch space (throwaway builds, probe harnesses, captured output), pre-made so the scratch-space rule never stalls on a missing directory. It lives beside `.claude/`, never inside it — writes under `.claude/` trip the permission system's own-settings protections.'''

# The operator CLAUDE.md now names the four documents and states each one's
# role, so the roles are no longer restated here; what travels to project birth
# is the residue that file does not carry — the two writing rules, the lean
# CLAUDE.md, the vanilla case, and ROADMAP.md. The precedence ranking went out
# of the baseline 2026-09 (it was being cited in place of investigation) and out
# of this chunk with it, along with `the code governs nothing`, which the
# baseline's stale-document rule contradicts: code that is newer and holds the
# project's principles is the current statement, not the defect.
[chunks.project-docs-setup]
text = '''**Project documents**: a project with a maintained contract carries the full document set — `THESIS.md`, `SPEC.md`, `ARCHITECTURE.md`, `CONVENTIONS.md` — with `ARCHITECTURE.md` citing `SPEC.md` rather than restating it, and `CONVENTIONS.md` carrying house rules and project-specific traps rather than contract. A project CLAUDE.md stays lean — only the project-specific rules that drift when the contract docs fall out of context. A vanilla project may have no CLAUDE.md and no SPEC.md; that is an acceptable state, not a defect. A project intended to be maintained also carries `ROADMAP.md` — next steps and future intent, even if one sentence ("spec implemented; no further work intended"). Future-thinking routes there, never inline in the contract docs, and ROADMAP.md is not handed to coding dispatches.'''

[chunks.data-formats-scope]
text = '''project-owned configuration and structured data files'''

