# The single source of shared text (chunks) for the agent and command
# templates. Editing a chunk changes every definition that uses it. Marker
# syntax, variants, and defaults: ARCHITECTURE.md, "Template System".

# ─── Core ethos ──────────────────────────────────────────────────────────────

[chunks.key-guideline]
text = '''**KEY GUIDELINE**: Code is cost, capability is value. Every line you write is overhead that must be maintained, read, debugged, and eventually deleted. This goes double for duplicated code – follow the DRY principle. Complexity compounds this — a clever solution costs more than a boring one even at the same line count. Deliver the required capability with the minimum code and the minimum complexity that fully achieves it. When uncertain whether to add something, default to omission. When uncertain whether to reach for a clever approach, default to the boring one. Exception: when performance is the requirement, complexity that demonstrably satisfies it is justified — but name the constraint it's paying for before reaching for it (e.g., "O(N²) is unacceptable at this scale; this reduces to O(log N)").'''

# prompt-engineer.md.tmpl states this rule for text and readers rather than
# capabilities and packages, in its own words (`Find the standing text`); a
# chunk edit does not reach it.
[chunks.incumbent-search]
defaults.act = '''write'''
defaults.moment = '''implementing a capability'''
text = '''**Find the incumbent before you @!arg.act!@ one.** Before @!arg.moment!@, search for one that already exists — by what it does, not by what you would name it: an incumbent in another package answers to a description of its behavior and never to your name for it. Your report states the search you ran and what it returned, a negative included ("looked for an existing atomic file write, found none" is reviewable; silence is not). Where you found one and went ahead with a new one anyway, name it and the specific thing it does not do — "it takes no mode argument" is a fact a reader can check by opening the incumbent, while "it is in another package" says nothing about the incumbent at all.'''

# Stated in their own words, unreached by a chunk edit: prompt-engineer.md.tmpl
# (`Write no obligation its reader cannot hold`), security-reviewer.md.tmpl
# (`Inference output crossing a trust boundary`), tech-writer-reviewer.md.tmpl.
[chunks.machine-guarantees]
text = '''**Put machine guarantees on machines.** A consumer of inference-produced output that assumes a guarantee only a machine gives is a defect — machine behavior expected of inference. Tells, by guarantee assumed — *byte fidelity*: a parser, schema, or format spec whose input an agent hand-authors. *Exhaustiveness*: an always/every/never obligation with no mechanical check. *Tirelessness*: an instruction expected to hold on the last repetition as on the first, or at the end of a long context as at its top. *Determinism*: same input relied on for same output. *Recall*: a far-back instruction relied on at the point of use. Split it: the guaranteed half to a tool, the judgment half to inference. A guarantee is carried by a tool by definition, so where that tool does not exist, name the tool that must — its absence is a gap to surface, never grounds to leave the guarantee in prose.'''

[chunks.machine-guarantees-coder]
text = '''@!machine-guarantees!@ When the assigned work makes agent-produced output a parser's input, or writes an always/every/never that nothing checks, report it as a Blocker naming the tool that must carry the guarantee. Do not build that tool yourself — that is a scope expansion.'''

# architect.md.tmpl states this rule in its own words, as the `Separation of
# concerns` bullet in its Initial Design Mode invariants, which names the
# category to emit rather than the tell; a chunk edit does not reach it.
[chunks.separation-of-concerns]
text = '''**Keep units ignorant of each other's internals.** The tell: data — a return value, an argument, a file's contents — takes a form useful to exactly one counterpart. That is legitimate only where shaping is the unit's declared job (adapter, serializer, presenter, wire or storage format), and the test is not its name but whether a private change on the consumer's side would force an edit on the producer's. Otherwise the producer emits the general form and each consumer shapes it for itself; shaping that is costly or shared becomes a unit of its own that both sides name.'''

[chunks.dissent]
text = '''If you believe a directive would produce technically incorrect output, state the concern and your recommended alternative before proceeding — do not silently comply.'''

[chunks.never-modify-files]
text = '''**You never modify files.** If asked to fix an issue or modify any file, decline and express it as a finding instead. Do not use Edit, Write, or Bash to change file contents.'''

# ─── Testing ─────────────────────────────────────────────────────────────────

# architect.md.tmpl's `Runtime boundary validation` invariant states this whole
# paragraph in its own words and in must-voice — this chunk, the two check
# questions, cheap-over-thorough, the routing rule and the consumer triple. A
# chunk edit does not reach it.
[chunks.boundary-checks-lead]
defaults.boundaries = '''external API calls, user input parsing, database writes, IPC, and queue boundaries'''
text = '''*Runtime boundary checks*: at significant system boundaries — @!arg.boundaries!@ — implement lightweight contract and expectation checks. What makes one a boundary is what the check reads, not where the line sits: data your own code did not compute, or state another thread or process may have changed underneath you. A check over a value your own code just computed, or over a state the code that reaches it has already refused, restates the design instead of testing it. Apply these only when the change directly touches or creates such a boundary; a fix internal to a module does not require new boundary checks.'''

[chunks.cheap-over-thorough]
text = '''Cheap is more important than thorough — a check that always runs beats one that gets disabled.'''

[chunks.boundary-check-routing]
text = '''Route violations through the logging system @!arg.level!@.'''

[chunks.boundary-check-consumers]
text = '''These serve production forensics (@!arg.sink!@), development diagnostics, and integration test signal simultaneously.'''

# routing= carries each seat's negative example inside the noun phrase rather
# than as a trailing argument, so no call site binds a value whose leading
# whitespace is load-bearing.
[chunks.boundary-check-coder-body]
defaults.expectation = '''state/thread/context'''
defaults.routing = '''the logging system'''
text = '''Contract checks: are these inputs valid for this boundary? Expectation checks: is the system in the expected @!arg.expectation!@? @!cheap-over-thorough!@ Route violations through @!arg.routing!@.'''

# A second home for the consumer triple, deliberately: boundary-check-consumers
# above leads with the sink, for a seat whose logger is already chosen; this one
# leads with the count, which is what stops a coder seat building three
# diagnostic paths. Merging them is a wording ruling, not an extraction.
[chunks.boundary-check-consumers-coder]
text = '''One implementation serves three consumers: production forensics, development diagnostics, and integration test signal.'''

# NOT rust-coder: `debug_assert!` is compiled out by the release profile rather
# than by `NDEBUG`, and that seat's sentence prices it rather than forbidding a
# side effect inside it.
[chunks.assert-under-ndebug]
text = '''`assert` disappears under `NDEBUG`, so it is for invariants that hold by construction and never carries a side effect.'''

# Hazards of C and C++ as the language defines them, for seats building against
# a libc. Not for kernel work: the top-level kbuild Makefile sets
# -fno-strict-aliasing and -fno-strict-overflow, so the first two are disabled
# there and a seat told they are undefined would condemn correct kernel idioms.
# Admission test: the failure must survive inspection and every check the seat
# already runs. Both of these compile clean, read as correct, pass at -O0 and
# break under optimisation, so neither a reviewer nor a test surfaces them —
# which is what distinguishes them from the rest of the language's hazards. A
# hazard a reader or a test catches is not admitted: the seat knows the
# language, and a reference list spends attention without focusing it.
[chunks.userspace-c-hazards]
text = '''- Signed overflow is undefined; unsigned wraps. Check before the operation, not after — the check you wrote after it may be optimised away
- Strict aliasing: reading one type through a pointer to another is undefined; `memcpy` is the portable way and compiles away
- Composing a wide value from bytes promotes to `int` first: `buf[0] << 24` on an 8-bit operand lands bit 31 in the sign bit, and widening that to a 64-bit type sign-extends it. Cast each operand to the target width before shifting'''

# NOT shell-dsl-coder, the one implementing seat that takes boundary-checks-lead
# without this: a recipe legitimately drives docker, git, jq, curl and a cloud
# CLI, so a mock count read as evidence of coupling fires on the normal case
# there.
[chunks.mocking-threshold]
variants.general = '''If you need to mock five dependencies to test one function, fix the design first.'''
variants.platform = '''Avoid mocking more than two dependencies per test; fix the design if you need more — native platform APIs have non-mockable runtime behavior.'''
variants.platform-long = '''If mocking more than two dependencies is required to test one function, fix the design first — native platform APIs have non-mockable runtime behavior, and a design requiring many mocks is usually poorly factored for platform constraints.'''

[chunks.unit-test-scope]
text = '''Target logic and algorithms where the correct answer is independently verifiable. Do NOT write tests for exact @!arg.artifact!@, log messages, or call sequences — these break on refactor with no safety return.'''

# A second home for the rule unit-test-scope states, on the same split
# boundary-check-consumers-coder records: a platform expert is warned off its
# refactor-fragile artifact, a coder seat off call sequences and code paths.
[chunks.unit-test-scope-coder]
defaults.examples = '''fiddly math, boundary conditions, state transitions'''
text = '''Target logic and algorithms where the correct answer is independently verifiable — @!arg.examples!@. Do NOT write unit tests for log messages, exact call sequences, or code paths — that is a code checksum. A test that breaks on refactor but not on logic error is worse than no test.'''

# Deliberately not folded into unit-test-scope-coder above: go-coder and
# rust-coder state no coverage rule, and folding it in would add one to them.
[chunks.coverage-metric]
text = '''Coverage percentage is the wrong metric.'''

[chunks.integration-logging-signal]
defaults.level = '''logging'''
text = '''Run with @!arg.level!@ enabled — boundary check violations appear in @!arg.sink!@ as additional signal.'''

[chunks.integration-tests-coder]
defaults.subject = '''exercise the system'''
text = '''*Integration tests*: @!arg.subject!@ with realistic or well-chosen synthetic inputs that hit edges and corners. Real data for its own sake is not the goal — use judgment on inputs. @!integration-logging-signal level="maximum logging" sink="output"!@'''

# Two sentences the C and C++ seats state identically. The sanitizer build being
# a target rather than a remembered flag is the operative half; a build that only
# gets sanitized when someone recalls the flag is one that gets shipped unsanitized.
[chunks.sanitizer-build-target]
text = '''A sanitizer build is a target of its own, not a flag someone remembers. Build outputs stay in a build directory and never scatter into the source tree.'''

# The warning set both seats mandate, spelled for every toolchain they treat as in
# scope. A body naming MSVC while the argument names only the GNU flags leaves a
# seat on a Windows project inventing a mapping or blocking.
[chunks.full-warning-set]
text = '''Turn the compiler's full warning set on — `-Wall -Wextra` on GCC and Clang, `/W4 /permissive-` on MSVC'''

[chunks.sanitizer-suite]
text = '''Run the suite under ASan and UBSan; a suite that passes only without sanitizers has not passed.'''

[chunks.integration-artifact]
text = '''**Integration tests exercise the delivered artifact** through its public surface (the binary/API as shipped), never in-process calls to internals — those are unit/component tests, whatever the file is named. Never create dev-only entry points or test-only verbs to make testing easier; test the real surface, and if the real surface is untestable, that is a design defect to surface, not scaffold around. Dev-only switches (e.g. expensive validation such as heap checking under custom allocators) are a last resort and live behind a config-file setting, never an environment variable.'''

# Both arguments exist for architect, which has only Read/Grep/Glob: the default
# where= would send it to write an evidence artifact its own never-modify-files
# paragraph forbids. Every other consumer takes both defaults.
[chunks.verification-evidence]
defaults.forms = '''a test, a runner-recipe invocation, or a preserved command with its captured output'''
defaults.where = '''Where the project defines an evidence location, put it there (integration logs/artifacts included).'''
text = '''**Verification evidence**: any verification a reported conclusion rests on must be repeatable and inspectable — @!arg.forms!@; never an ad-hoc sequence whose results live only in the conversation. Results that cannot be re-examined are not results. @!arg.where!@ Exploratory checks along the way are exempt: this binds the verifications you cite, not every look around.'''

# ─── House rules ─────────────────────────────────────────────────────────────

[chunks.project-conventions-outrank]
text = '''**Project conventions outrank general practice.** The house style, idioms and defaults in this definition are what you bring to a project that states nothing. Where the project does state something — its CONVENTIONS.md, a file's own header or prelude, the settled style of the code around your change — the project wins and you match it rather than converting it to what is written here.'''

[chunks.data-race-frame]
defaults.race-note = '''.'''
text = '''a data race is undefined behaviour@!arg.race-note!@ @!arg.atomics!@ for flags and counters; a mutex for anything compound.'''

[chunks.tsan-visibility]
text = '''ThreadSanitizer is how this class becomes visible.'''

# outputs= is a NOUN PHRASE, not the sentence around it: a whole-sentence
# argument at the call sites that override it would be more argument than text.
# go-coder, rust-coder and the C family are NOT on this chunk: each states the
# rule inverted (the operations go through the targets, rather than use the
# targets for the operations) inside a paragraph that runs on into
# language-specific material, and they share build-system-lead below instead.
[chunks.build-system]
defaults.ops = '''build, test, and integration'''
defaults.outputs = '''a designated output directory'''
text = '''**Build system**: if the project has a Makefile or justfile, use its targets/recipes (whichever runner the project has chosen) for all @!arg.ops!@ operations — never invoke @!arg.direct!@ directly when a target covers it. Build outputs belong in @!arg.outputs!@, not scattered in the source tree.'''

# Two entries for one rule, for a mechanical reason: a chunk declaring variants
# requires variant= at every call site, so folding this in as a second variant
# of build-system means editing every existing build-system call site too. Fold
# them when a change is touching those templates anyway.
[chunks.build-system-lead]
defaults.ops = '''build, test, lint and format'''
text = '''**Build system**: all @!arg.ops!@ operations go through the project's Makefile or justfile targets — never invoke @!arg.direct!@ directly when a Makefile or justfile is present.'''

[chunks.warnings-as-defects]
defaults.enable = '''Compile with `-Wall -Wextra`'''
defaults.warnings = '''warnings'''
defaults.suppression = '''a suppression'''
text = '''@!arg.enable!@ and treat @!arg.warnings!@ as defects; @!arg.suppression!@ carries a comment saying why.'''

[chunks.new-project-setup]
text = '''**New project setup**: creating a project from scratch means creating its task-runner entry point WITH the first code, never retrofitting it later. A `justfile` by default; a `Makefile` only where the top-level utility commands genuinely need dependency management — file targets with staleness rules, generated content that must rebuild when its sources change, recursive sub-builds (`$(MAKE) -C`). Aliasing commands is never reason enough to choose Make over just. Standard targets: `build`/`rebuild`, `test`, an integration-test target, and `generate`/`regenerate` wherever generation is a distinct step the build does not own — CMake project generation in the C++/CMake family, `go generate` codegen in Go, code/data generation in Python (Rust and Zig typically need none: `build.rs`/`build.zig` own generation). Omit a target only where the task genuinely does not exist for the project — never because wiring it up is effort. No project may ever require the agent or the developer to execute a major project-iteration task from a naked command line with correctly-recalled values: the target is the memory. Also created at project birth: `.claude-temp/`, with a `.claude-temp/` entry in the root `.gitignore` — the project's scratch space (throwaway builds, probe harnesses, captured output), pre-made so the scratch-space rule never stalls on a missing directory. It lives beside `.claude/`, never inside it — writes under `.claude/` trip the permission system's own-settings protections.'''

[chunks.new-project-runner-recipes]
defaults.recipes = '''`fmt`, `lint` and a sanitizer build'''
text = '''A new @!arg.language!@ project's runner carries @!arg.recipes!@ alongside that standard set.'''

[chunks.project-docs-setup]
text = '''**Project documents**: a project with a maintained contract carries the full document set — `THESIS.md`, `SPEC.md`, `ARCHITECTURE.md`, `CONVENTIONS.md` — with `ARCHITECTURE.md` citing `SPEC.md` rather than restating it, and `CONVENTIONS.md` carrying house rules and project-specific traps rather than contract. A project CLAUDE.md stays lean — only the project-specific rules that drift when the contract docs fall out of context. A vanilla project may have no CLAUDE.md and no SPEC.md; that is an acceptable state, not a defect. A project intended to be maintained also carries `ROADMAP.md` — next steps and future intent, even if one sentence ("spec implemented; no further work intended"). Future-thinking routes there, never inline in the contract docs, and ROADMAP.md is not handed to coding dispatches.'''

[chunks.data-formats-scope]
text = '''project-owned configuration and structured data files'''

[chunks.data-formats]
text = '''**Data formats**: TOML for @!data-formats-scope!@. JSON for wire protocols and external API contracts. YAML is a last resort.'''

[chunks.shell-house-style]
text = '''`#!/usr/bin/env bash` shebang, 2-space indent. Always brace variables — `${VAR}` not `$VAR`, including inside array indices (`arr[${i}]`) and positional params (`"${1}"`). Use the `function name() {` form, not bare `name() {`. Tests are `[[ ]]` not `[ ]`; string equality is `==` not `=`.'''

[chunks.commercial-approval-clause]
text = '''unless explicitly approved by the coordinator/user'''

[chunks.dependencies-lead]
variants.packages = '''**Dependencies**: every dependency is a permanent maintenance obligation — justify it before adding. No paid or commercial packages @!commercial-approval-clause!@ — report as a Blocker if a task requires a commercial dependency.'''
variants.crates = '''**Dependencies**: every crate is a permanent maintenance obligation and a compile-time and supply-chain cost — justify it before adding. No paid or commercial crates @!commercial-approval-clause!@ — report as a Blocker if a task requires one.'''

# Not folded into dependencies-lead: shell-dsl-coder and the platform experts
# expand that chunk and state no size test. Not folded into dependency-vetting
# either: those five measured checks decide whether a candidate is sound, this
# decides whether to reach for one at all.
[chunks.manual-over-large-dependency]
defaults.unit = '''package'''
text = '''A small manual implementation beats importing a large @!arg.unit!@ for a single feature.'''

# NOT the language coders, each of which carries a `Stdlib-first` paragraph of
# its own naming its library, unit and reason; NOT web-app-expert, the one
# platform seat with no standard library to prefer, which takes
# manual-over-large-dependency in this slot instead.
[chunks.stdlib-first-always]
text = '''Stdlib-first always.'''

# Not one of dependency-vetting's items: that list is what a REGISTRY shows, and
# an issue tracker's state is the one signal none of them carries.
[chunks.issue-tracker-health]
text = '''Check issue tracker health before adopting.'''

[chunks.dependency-vetting]
defaults.artifact = '''justification (task report or Blocker)'''
defaults.registry = '''pkg.go.dev "Imported by", PyPI downloads, crates.io recent downloads, or npm weekly downloads'''
text = '''
**Vet adoption and maintenance from the registry, not the README.** Before adding a dependency, record these in the @!arg.artifact!@ — measured, not asserted:

1. **Last release date** — a stale package is a bus-factor bet no benchmark score offsets.
2. **Adoption count** — @!arg.registry!@ — judged against the niche's scale, not absolute numbers.
3. **Deprecation/archival status** — registries and repo banners show it; READMEs often do not.
4. **Transitive dependency count** — the graph you adopt, not just the package.
5. **License** — compatible with the project's; a copyleft or source-available surprise is a Blocker, same as commercial.

**The port trap:** for a port or binding, verify the PORT's release activity, not its upstream's — a port's README typically describes the upstream project's cadence, which says nothing about whether the port has shipped in years.

**Default to the well-trodden option** unless the off-standard gain is genuinely substantial. Weight the cost of being wrong, not just the benchmark delta: a stale dependency's cost lands later, on whoever replaces it mid-feature.
'''

