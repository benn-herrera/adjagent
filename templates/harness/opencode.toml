[harness.project-temp-dir]
text = ".opencode-temp"

[harness.project-harness-dir]
text = ".opencode"

[harness.user-harness-dir]
text = "~/.config/opencode"

[harness.agents-file]
text = "AGENTS.md"

[harness.agent-frontmatter]
name        = false
description = "@!dyn.authored-value!@"
model       = "@!dyn.authored-value!@"
color       = "@!dyn.authored-value!@"
tools       = false
permission  = { text = "@!dyn.tools-as-permission!@", injected = true }
mode        = { text = "subagent", injected = true }
disable     = { text = "@!dyn.undispatchable-marker!@", injected = true }

[harness.tools]
read      = ["read"]
grep      = ["grep"]
glob      = ["glob", "list"]
edit      = ["edit"]
write     = ["edit"]
bash      = ["bash"]
webfetch  = ["webfetch"]
websearch = ["websearch"]
agent     = ["task"]

[harness.model]
pattern = '^(inherit|[^/\s]+/\S+)$'
shape = "provider/model with the provider named as your opencode config names it, for example omlx/Qwen3.8-Flash-Next, or inherit"
inherit-text = ""
